<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Seamate IMUCET Mock Test 7</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --navy-950:#0a1630;
  --navy-900:#0e1f42;
  --navy-800:#15305e;
  --navy-700:#1c3f79;
  --navy-600:#26509a;
  --navy-100:#e7edf7;
  --navy-050:#f3f6fb;
  --gold-600:#a9781f;
  --gold-500:#c8952e;
  --gold-100:#f6ecd6;
  --paper:#f6f7fa;
  --card:#ffffff;
  --ink:#141a2b;
  --ink-soft:#4a5468;
  --line:#dde3ef;
  --danger:#a4302a;
  --danger-bg:#fbeae9;
  --success:#1e7145;
  --success-bg:#e8f5ee;
  --warn:#95601a;
  --warn-bg:#fdf1e0;
  --review:#5b3a8e;
  --review-bg:#efe7f8;
  --radius:10px;
  --shadow:0 1px 2px rgba(14,31,66,.06), 0 6px 20px -8px rgba(14,31,66,.18);
  color-scheme: light;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0b1222;
    --card:#111a30;
    --ink:#eef1f8;
    --ink-soft:#a9b3cc;
    --line:#233258;
    --navy-050:#101c38;
    --navy-100:#16254a;
    --danger-bg:#3a1a19;
    --success-bg:#132b20;
    --warn-bg:#33270f;
    --review-bg:#241a3a;
  }
}
:root[data-theme="dark"]{
  --paper:#0b1222;
  --card:#111a30;
  --ink:#eef1f8;
  --ink-soft:#a9b3cc;
  --line:#233258;
  --navy-050:#101c38;
  --navy-100:#16254a;
  --danger-bg:#3a1a19;
  --success-bg:#132b20;
  --warn-bg:#33270f;
  --review-bg:#241a3a;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;}
.mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
a{color:var(--navy-600);}
button{font-family:inherit;}
::selection{background:var(--gold-100);}

.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.center-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:28px 16px;
}
.brand-row{
  display:flex;align-items:center;gap:14px;justify-content:center;
  margin-bottom:6px;
}
.brand-logo{width:52px;height:52px;object-fit:contain;flex:none;}
.brand-name{
  font-family:'Source Serif 4', serif;
  font-weight:700;letter-spacing:.01em;
  color:var(--navy-900);
}
.brand-name .accent{color:var(--gold-600);}
:root[data-theme="dark"] .brand-name, :root:not([data-theme="light"]) .brand-name{color:#e9edf7;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand-name{color:#e9edf7;}}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

/* ---------- Registration / Instructions ---------- */
.auth-card{width:100%;max-width:480px;padding:30px 28px 26px;}
.auth-card h1{font-size:1.35rem;margin:2px 0 2px;text-align:center;color:var(--navy-900);}
:root[data-theme="dark"] .auth-card h1, :root:not([data-theme="light"]) .auth-card h1{color:#eef1f8;}
.auth-sub{
  text-align:center;color:var(--ink-soft);font-size:.86rem;margin:0 0 22px;
}
.field{margin-bottom:16px;}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);color:var(--ink);font-size:.95rem;
}
.field input:focus{outline:2px solid var(--navy-600);outline-offset:1px;border-color:var(--navy-600);}
.field .hint{font-size:.72rem;color:var(--ink-soft);margin-top:4px;}
.field .err{font-size:.76rem;color:var(--danger);margin-top:4px;display:none;}
.field.invalid input{border-color:var(--danger);}
.field.invalid .err{display:block;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:8px;border:none;font-weight:600;font-size:.92rem;
  cursor:pointer;transition:transform .04s ease, background .15s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy-800);color:#fff;width:100%;}
.btn-primary:hover{background:var(--navy-700);}
.btn-primary:disabled{background:#93a0bd;cursor:not-allowed;}
.btn-gold{background:var(--gold-500);color:#26200c;}
.btn-gold:hover{background:var(--gold-600);color:#fff;}
.btn-ghost{background:transparent;color:var(--navy-700);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--navy-050);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:8px 12px;font-size:.8rem;}
.btn-block{width:100%;}

.instr-card{width:100%;max-width:640px;padding:30px 30px 26px;}
.instr-card h1{font-size:1.3rem;color:var(--navy-900);margin:2px 0 18px;text-align:center;}
:root[data-theme="dark"] .instr-card h1, :root:not([data-theme="light"]) .instr-card h1{color:#eef1f8;}
.instr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:16px;}
@media (max-width:520px){.instr-grid{grid-template-columns:1fr;}}
.instr-stat{
  background:var(--navy-050);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;
}
.instr-stat .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.instr-stat .v{font-size:.98rem;font-weight:700;color:var(--navy-800);margin-top:2px;}
:root[data-theme="dark"] .instr-stat .v, :root:not([data-theme="light"]) .instr-stat .v{color:#c9d6f2;}

.instr-list{margin:0 0 18px;padding:0;list-style:none;}
.instr-list li{
  display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);
  font-size:.87rem;line-height:1.45;color:var(--ink);
}
.instr-list li:last-child{border-bottom:none;}
.instr-list .num{
  flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy-800);color:#fff;
  font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.instr-list b{color:var(--navy-800);}
:root[data-theme="dark"] .instr-list b, :root:not([data-theme="light"]) .instr-list b{color:#c9d6f2;}
.instr-warn{
  background:var(--warn-bg);border:1px solid var(--gold-500);border-radius:8px;
  padding:11px 13px;font-size:.83rem;color:var(--warn);margin-bottom:16px;line-height:1.5;
}
.ack-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:16px;font-size:.83rem;color:var(--ink-soft);}
.ack-row input{margin-top:3px;}

/* ---------- Exam screen ---------- */
.exam-header{
  position:sticky;top:0;z-index:30;
  background:var(--navy-900);color:#fff;
  display:flex;align-items:center;gap:12px;
  padding:9px 14px;border-bottom:3px solid var(--gold-500);
}
.exam-header .logo{width:34px;height:34px;object-fit:contain;flex:none;}
.exam-header .titles{flex:1;min-width:0;}
.exam-header .titles .t1{font-family:'Source Serif 4',serif;font-weight:700;font-size:.92rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exam-header .titles .t2{font-size:.68rem;color:#b9c6e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exam-header .cand{
  font-size:.72rem;color:#dfe6f5;text-align:right;line-height:1.25;flex:none;display:none;
}
@media (min-width:640px){.exam-header .cand{display:block;}}
.timer-pill{
  flex:none;background:#0a1630;border:1px solid #2a3f6d;border-radius:8px;
  padding:6px 12px;text-align:center;min-width:88px;
}
.timer-pill.low{background:#3a1a19;border-color:var(--danger);}
.timer-pill .lbl{font-size:.6rem;color:#9fb0d6;text-transform:uppercase;letter-spacing:.06em;}
.timer-pill .val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:1rem;}
.grid-toggle{
  flex:none;background:var(--gold-500);color:#26200c;border:none;border-radius:8px;
  padding:8px 11px;font-weight:700;font-size:.72rem;cursor:pointer;
}

.exam-body{flex:1;display:flex;max-width:1180px;margin:0 auto;width:100%;padding:16px;gap:16px;}
@media (max-width:900px){.exam-body{padding:10px;gap:10px;}}

.qpanel{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
.qmeta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.qsection-pill{
  background:var(--navy-100);color:var(--navy-800);font-weight:700;font-size:.72rem;
  padding:5px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;
}
:root[data-theme="dark"] .qsection-pill, :root:not([data-theme="light"]) .qsection-pill{color:#c9d6f2;}
.qnum{font-size:.8rem;color:var(--ink-soft);font-weight:600;}
.qcard{padding:20px 22px;}
.qtext{font-size:1.03rem;line-height:1.6;color:var(--ink);margin:0 0 18px;}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);
  border-radius:8px;margin-bottom:10px;cursor:pointer;transition:border-color .1s, background .1s;
}
.opt:hover{border-color:var(--navy-600);}
.opt.sel{border-color:var(--navy-700);background:var(--navy-050);}
.opt .bullet{
  flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--ink-soft);
  margin-top:1px;
}
.opt.sel .bullet{border-color:var(--navy-700);background:var(--navy-700);color:#fff;}
.opt .otext{font-size:.93rem;line-height:1.5;}

.qactions{display:flex;flex-wrap:wrap;gap:8px;}
.qactions .btn{flex:1 1 auto;}

.navgrid-panel{
  flex:none;width:260px;display:flex;flex-direction:column;gap:10px;
}
@media (max-width:900px){
  .navgrid-panel{
    position:fixed;inset:0;z-index:50;width:auto;background:rgba(10,17,35,.55);
    display:none;padding:14px;
  }
  .navgrid-panel.open{display:flex;}
  .navgrid-inner{margin:auto 0 0;max-height:82vh;overflow:auto;}
}
.navgrid-inner{padding:16px;}
.navgrid-close{display:none;}
@media (max-width:900px){.navgrid-close{display:block;margin-left:auto;background:none;border:none;font-size:1.1rem;color:var(--ink-soft);cursor:pointer;}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:.72rem;margin-bottom:12px;}
.legend .li{display:flex;align-items:center;gap:6px;color:var(--ink-soft);}
.legend .sw{width:14px;height:14px;border-radius:4px;flex:none;}
.section-jump{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.section-jump button{
  flex:1;font-size:.7rem;font-weight:700;padding:6px 4px;border-radius:6px;border:1px solid var(--line);
  background:var(--paper);cursor:pointer;color:var(--ink-soft);
}
.section-jump button.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:50vh;overflow:auto;padding-right:2px;}
.qgrid button{
  aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--paper);
  font-size:.72rem;font-weight:600;cursor:pointer;color:var(--ink-soft);position:relative;
}
.qgrid button.cur{outline:2px solid var(--navy-800);outline-offset:1px;}
.qgrid button.answered{background:var(--success);border-color:var(--success);color:#fff;}
.qgrid button.notanswered{background:var(--danger);border-color:var(--danger);color:#fff;}
.qgrid button.review{background:var(--review);border-color:var(--review);color:#fff;}
.qgrid button.review.answered::after{
  content:"";position:absolute;bottom:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--success-bg);
}
.qgrid button.notvisited{background:var(--paper);}

.summary-mini{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:10px;margin-top:10px;}
.summary-mini b{color:var(--ink);}

/* ---------- Result / performance page ---------- */
.result-wrap{max-width:920px;margin:0 auto;padding:22px 16px 60px;width:100%;}
.result-head{
  display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;
}
.result-head .info h2{margin:0 0 2px;font-size:1.3rem;color:var(--navy-900);}
:root[data-theme="dark"] .result-head .info h2, :root:not([data-theme="light"]) .result-head .info h2{color:#eef1f8;}
.result-head .info p{margin:0;font-size:.82rem;color:var(--ink-soft);}
.status-badge{
  margin-left:auto;font-weight:700;font-size:.78rem;padding:7px 14px;border-radius:20px;
}
.status-badge.pass{background:var(--success-bg);color:var(--success);}
.status-badge.fail{background:var(--danger-bg);color:var(--danger);}
.status-badge.flagged{background:var(--warn-bg);color:var(--warn);}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
@media (max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-box{padding:14px 14px;text-align:left;}
.stat-box .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.stat-box .v{font-family:'Source Serif 4',serif;font-size:1.45rem;font-weight:700;color:var(--navy-900);margin-top:3px;}
:root[data-theme="dark"] .stat-box .v, :root:not([data-theme="light"]) .stat-box .v{color:#eef1f8;}
.stat-box.good .v{color:var(--success);}
.stat-box.bad .v{color:var(--danger);}

.chart-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-bottom:20px;}
@media (max-width:760px){.chart-grid{grid-template-columns:1fr;}}
.chart-card{padding:16px 16px 10px;}
.chart-card h3{margin:0 0 10px;font-size:.85rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

.cheat-card{padding:16px 18px;margin-bottom:20px;}
.cheat-card h3{margin:0 0 10px;font-size:.85rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.cheat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
@media (max-width:640px){.cheat-grid{grid-template-columns:repeat(2,1fr);}}
.cheat-item .k{font-size:.68rem;color:var(--ink-soft);}
.cheat-item .v{font-weight:700;font-size:1.05rem;}

.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.action-row .btn{flex:1 1 200px;}

.review-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.review-table th,.review-table td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;}
.review-table th{color:var(--ink-soft);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;}
.review-table td.status-c{color:var(--success);font-weight:700;}
.review-table td.status-w{color:var(--danger);font-weight:700;}
.review-table td.status-u{color:var(--ink-soft);}
.review-card{padding:16px 18px;}
.review-card h3{margin:0 0 4px;font-size:.9rem;}
.review-card summary{cursor:pointer;font-weight:600;color:var(--navy-700);font-size:.86rem;padding:6px 0;}

.footer-note{text-align:center;color:var(--ink-soft);font-size:.72rem;padding:20px 16px 30px;}
.footer-note a{color:var(--ink-soft);text-decoration:underline;}

/* ---------- Modals ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,17,35,.6);display:none;
  align-items:center;justify-content:center;z-index:100;padding:16px;
}
.overlay.open{display:flex;}
.modal{background:var(--card);border-radius:12px;max-width:400px;width:100%;padding:22px;box-shadow:var(--shadow);}
.modal h3{margin:0 0 8px;font-size:1.05rem;color:var(--danger);}
.modal p{font-size:.87rem;color:var(--ink-soft);line-height:1.5;margin:0 0 16px;}
.modal.warn h3{color:var(--warn);}

/* ---------- Admin ---------- */
.admin-wrap{max-width:1000px;margin:0 auto;padding:20px 16px 50px;}
.admin-table-wrap{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px;}
.admin-table{width:100%;border-collapse:collapse;font-size:.78rem;white-space:nowrap;}
.admin-table th,.admin-table td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;}
.admin-table th{position:sticky;top:0;background:var(--navy-050);color:var(--ink-soft);font-size:.68rem;text-transform:uppercase;}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}

.print-only{display:none;}
@media print{
  .exam-header,.no-print,.navgrid-panel,.grid-toggle{display:none !important;}
  body{background:#fff;}
  .print-only{display:block;}
  .result-wrap{max-width:100%;padding:0;}
  .card{box-shadow:none;border:1px solid #ccc;}
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

</style>
</head>

ection": "Physics", "q": "The red Hα line of the Balmer series (656.3 nm) corresponds to electron transition:", "options": {"A": "n = 2 → n = 1", "B": "n = 3 → n = 2", "C": "n = 4 → n = 2", "D": "n = ∞ → n = 2"}, "answer": "B"}, {"id": 11, "section": "Physics", "q": "Relation between half-life (T1/2) and decay constant (λ) is:", "options": {"A": "T1/2 = 0.693 / λ", "B": "T1/2 = λ / 0.693", "C": "T1/2 = 1 / λ", "D": "T1/2 = 0.301 / λ"}, "answer": "A"}, {"id": 12, "section": "Physics", "q": "The radius of innermost electron orbit of hydrogen is 0.53 Å. The radius of the 3rd orbit (n = 3) is:", "options": {"A": "1.59 Å", "B": "2.12 Å", "C": "4.77 Å", "D": "0.177 Å"}, "answer": "C"}, {"id": 13, "section": "Physics", "q": "The fundamental nuclear force between nucleons is:", "options": {"A": "Charge independent", "B": "Long range", "C": "Always central", "D": "Inverse square law"}, "answer": "A"}, {"id": 14, "section": "Physics", "q": "A nucleus ZX^A emits one α followed by two β− particles sequentially. The resulting nucleus is:", "options": {"A": "An isotope of X", "B": "An isobar of X", "C": "An isotone of X", "D": "An isomer of X"}, "answer": "A"}, {"id": 15, "section": "Physics", "q": "The orbital speed of an electron in Bohr's n-th orbit is related to quantum number n by:", "options": {"A": "v ∝ n", "B": "v ∝ 1/n", "C": "v ∝ n²", "D": "v ∝ 1/n²"}, "answer": "B"}, {"id": 16, "section": "Physics", "q": "Which radiation has the greatest specific ionizing power in a gas?", "options": {"A": "α-particle", "B": "β-particle", "C": "γ-ray", "D": "Thermal neutron"}, "answer": "A"}, {"id": 17, "section": "Physics", "q": "The rest mass of a free neutron compared to a proton is:", "options": {"A": "Slightly less than proton", "B": "Slightly greater than proton", "C": "Exactly identical", "D": "Equal to 1836 me"}, "answer": "B"}, {"id": 18, "section": "Physics", "q": "The de Broglie wavelength of an electron in the 1st Bohr orbit of radius a0 is:", "options": {"A": "a0", "B": "2π a0", "C": "π a0", "D": "4π a0"}, "answer": "B"}, {"id": 19, "section": "Physics", "q": "The nuclear density of a nucleus of mass number A depends on A as:", "options": {"A": "A0 (independent)", "B": "A1/3", "C": "A", "D": "A−1"}, "answer": "A"}, {"id": 20, "section": "Physics", "q": "The SI unit of radioactivity named Becquerel (Bq) is defined as:", "options": {"A": "1 disintegration / s", "B": "3.7 × 10¹⁰ dps", "C": "10⁶ dps", "D": "1 decay / min"}, "answer": "A"}, {"id": 21, "section": "Physics", "q": "Bohr's angular momentum quantization condition (L = nh / 2π) is naturally explained by:", "options": {"A": "Standing de Broglie waves", "B": "Photoelectric effect", "C": "Pauli's principle", "D": "Heisenberg principle"}, "answer": "A"}, {"id": 22, "section": "Physics", "q": "Ground state energy of H-atom is −13.6 eV. Kinetic energy of electron in 1st excited state (n = 2) is:", "options": {"A": "+3.4 eV", "B": "−3.4 eV", "C": "+1.51 eV", "D": "+13.6 eV"}, "answer": "A"}, {"id": 23, "section": "Physics", "q": "The tremendous source of stellar energy in the Sun and stars is primarily:", "options": {"A": "Fission of uranium", "B": "Proton-proton fusion cycle", "C": "Gravitational collapse", "D": "Radium alpha decay"}, "answer": "B"}, {"id": 24, "section": "Physics", "q": "A radioactive sample starts with N0 nuclei. What fraction has decayed after 2 half-lives?", "options": {"A": "N0/4", "B": "N0/2", "C": "3N0/4", "D": "7N0/8"}, "answer": "C"}, {"id": 25, "section": "Physics", "q": "The peak value of binding energy per nucleon for 56Fe is approximately:", "options": {"A": "7.6 MeV", "B": "8.8 MeV", "C": "10.2 MeV", "D": "13.6 MeV"}, "answer": "B"}, {"id": 26, "section": "Physics", "q": "Which of the following statements concerning strong nuclear forces is FALSE?", "options": {"A": "Strongest fundamental force", "B": "Operates equally: p−p, n−n, p−n", "C": "Obeys inverse square law", "D": "Short-range (~1 to 2 fm)"}, "answer": "C"}, {"id": 27, "section": "Physics", "q": "An electron jumps from state n = 3 to n = 1. The total number of possible spectral emission lines is:", "options": {"A": "2", "B": "3", "C": "6", "D": "4"}, "answer": "B"}, {"id": 28, "section": "Physics", "q": "The ratio of nuclear radii of 13Al27 and 29Cu64 is:", "options": {"A": "3 : 4", "B": "9 : 16", "C": "27 : 64", "D": "1 : 2"}, "answer": "A"}, {"id": 29, "section": "Physics", "q": "The ratio of maximum to minimum wavelength in the Lyman series is:", "options": {"A": "4/3", "B": "9/5", "C": "4/1", "D": "3/2"}, "answer": "A"}, {"id": 30, "section": "Physics", "q": "In the radioactive series decay 92U238 → 82Pb206, how many α and β− particles are emitted?", "options": {"A": "8 α and 6 β−", "B": "6 α and 8 β−", "C": "8 α and 8 β−", "D": "4 α and 2 β−"}, "answer": "A"}, {"id": 31, "section": "Physics", "q": "Along with a β− particle (electron), which other neutral particle is simultaneously emitted?", "options": {"A": "Neutrino (ν)", "B": "Antineutrino (ν̄)", "C": "Positron (e+)", "D": "Photon (γ) only"}, "answer": "B"}, {"id": 32, "section": "Physics", "q": "What is the ground state ionization energy of a hydrogen-like Li2+ ion (Z = 3)?", "options": {"A": "13.6 eV", "B": "40.8 eV", "C": "122.4 eV", "D": "54.4 eV"}, "answer": "C"}, {"id": 33, "section": "Physics", "q": "The mass defect Δm of a nucleus with Z protons and N neutrons is defined as:", "options": {"A": "Mnuc − (Z mp + N mn)", "B": "(Z mp + N mn) − Mnuc", "C": "Z mp − N mn", "D": "Mnuc / A"}, "answer": "B"}, {"id": 34, "section": "Physics", "q": "In Rutherford's α-scattering experiment, distance of closest approach r0 is proportional to kinetic energy K as:", "options": {"A": "r0 ∝ K", "B": "r0 ∝ 1/K", "C": "r0 ∝ √K", "D": "r0 ∝ 1/√K"}, "answer": "B"}, {"id": 35, "section": "Physics", "q": "If the half-life of a radioactive material is 2 hours, what fraction has decayed after 6 hours?", "options": {"A": "1/8", "B": "3/8", "C": "7/8", "D": "5/8"}, "answer": "C"}, {"id": 36, "section": "Physics", "q": "The nuclear force between two protons at distance r < 0.8 fm is:", "options": {"A": "Strongly attractive", "B": "Strongly repulsive", "C": "Zero", "D": "Purely Coulombic"}, "answer": "B"}, {"id": 37, "section": "Physics", "q": "Which spectral series of hydrogen atom lies strictly in the visible spectrum?", "options": {"A": "Lyman series", "B": "Paschen series", "C": "Balmer series", "D": "Brackett series"}, "answer": "C"}, {"id": 38, "section": "Physics", "q": "Which of the following particles is NOT spontaneously emitted in natural radioactivity?", "options": {"A": "Positrons", "B": "Neutrons", "C": "α-particles", "D": "γ-photons"}, "answer": "B"}, {"id": 39, "section": "Physics", "q": "The ratio of time periods of an electron in n = 1 and n = 2 orbits of hydrogen (T ∝ n³) is:", "options": {"A": "1 : 2", "B": "1 : 4", "C": "1 : 8", "D": "1 : 16"}, "answer": "C"}, {"id": 40, "section": "Physics", "q": "In the artificial transmutation 7N14 + 2He4 → 8O17 + X, the particle X is:", "options": {"A": "Neutron (0n¹)", "B": "Proton (1H1)", "C": "Positron (e+)", "D": "Electron (e−)"}, "answer": "B"}, {"id": 41, "section": "Physics", "q": "A radioactive element has half-life T. After time t = 3T, the fraction remaining undecayed is:", "options": {"A": "1/3", "B": "1/6", "C": "1/8", "D": "7/8"}, "answer": "C"}, {"id": 42, "section": "Physics", "q": "When a nucleus de-excites by emitting a γ-ray photon, atomic number Z and mass number A:", "options": {"A": "Z decreases by 1", "B": "A decreases by 4", "C": "Both Z and A remain unchanged", "D": "Z increases by 1"}, "answer": "C"}, {"id": 43, "section": "Physics", "q": "The spectral series of atomic hydrogen that falls in the far infrared region is:", "options": {"A": "Paschen series", "B": "Brackett series", "C": "Pfund series", "D": "Lyman series"}, "answer": "C"}, {"id": 44, "section": "Physics", "q": "In the nuclear reaction ZX^A → Z−2Y^A−4 + α, which quantity is NOT conserved?", "options": {"A": "Nucleon number", "B": "Total charge", "C": "Total rest mass", "D": "Total relativistic energy"}, "answer": "C"}, {"id": 45, "section": "Physics", "q": "What is the orbital angular momentum of an electron in the 3rd orbit of hydrogen atom?", "options": {"A": "1.5 h/π", "B": "3 h/π", "C": "h/2π", "D": "3h"}, "answer": "A"}, {"id": 46, "section": "Physics", "q": "If radioactive activity is A1 at time t1 and A2 at t2, the decay constant λ is:", "options": {"A": "(A1 − A2) / (t2 − t1)", "B": "ln(A1/A2) / (t2 − t1)", "C": "ln(A2/A1) / (t2 − t1)", "D": "(A1/A2) / (t2 − t1)"}, "answer": "B"}, {"id": 47, "section": "Physics", "q": "An electron transitions from n = 4 to n = 2 in H-atom. The emitted photon line is designated as:", "options": {"A": "Hα line", "B": "Hβ line", "C": "Hγ line", "D": "Hδ line"}, "answer": "B"}, {"id": 48, "section": "Physics", "q": "In nuclear fission of 235U, thermal (slow) neutrons are preferred over fast neutrons because:", "options": {"A": "Fast neutrons absorbed by 238U", "B": "Higher fission cross-section", "C": "Greater forward momentum", "D": "Both (A) and (B)"}, "answer": "D"}, {"id": 49, "section": "Physics", "q": "Mean life (τ) of a radioactive nuclide is related to decay constant (λ) as:", "options": {"A": "τ = 1/λ", "B": "τ = 0.693/λ", "C": "τ = λ·ln 2", "D": "τ = λ2"}, "answer": "A"}, {"id": 50, "section": "Physics", "q": "The pair 6C14 and 7N14 are classified as:", "options": {"A": "Isotopes", "B": "Isobars", "C": "Isotones", "D": "Isomers"}, "answer": "B"}, {"id": 51, "section": "Physics", "q": "Which of the following emissions has the highest penetrating power through matter?", "options": {"A": "α-particle", "B": "β-particle", "C": "γ-ray photon", "D": "Proton"}, "answer": "C"}, {"id": 52, "section": "Physics", "q": "Excitation energy required to elevate an electron from ground state (n = 1) to n = 2 is:", "options": {"A": "3.4 eV", "B": "10.2 eV", "C": "12.09 eV", "D": "13.6 eV"}, "answer": "B"}, {"id": 53, "section": "Physics", "q": "The order of magnitude of nuclear matter density is roughly:", "options": {"A": "10³ kg/m3", "B": "10⁷ kg/m3", "C": "10¹⁷ kg/m3", "D": "10²⁷ kg/m3"}, "answer": "C"}, {"id": 54, "section": "Physics", "q": "Binding energy per nucleon for heavy nuclei (A > 100) decreases with increasing A mainly due to:", "options": {"A": "Force saturation", "B": "Coulomb repulsion", "C": "Spin pairing", "D": "Neutrino emission"}, "answer": "B"}, {"id": 55, "section": "Physics", "q": "In β+ (positron) decay, emission of a neutrino is required to conserve:", "options": {"A": "Mass only", "B": "Lepton number & spin", "C": "Charge alone", "D": "Magnetic field"}, "answer": "B"}, {"id": 56, "section": "Physics", "q": "Total energy of an electron in the 2nd orbit (n = 2) of He+ ion (Z = 2) is:", "options": {"A": "−13.6 eV", "B": "−54.4 eV", "C": "−3.4 eV", "D": "−27.2 eV"}, "answer": "A"}, {"id": 57, "section": "Physics", "q": "The decay constant (λ) of an isotope having half-life of 138.6 days is:", "options": {"A": "0.005 day−1", "B": "0.05 day−1", "C": "0.5 day−1", "D": "0.002 day−1"}, "answer": "A"}, {"id": 58, "section": "Physics", "q": "If two nuclei have mass numbers in the ratio 1 : 27, the ratio of their nuclear radii is:", "options": {"A": "1 : 27", "B": "1 : 9", "C": "1 : 3", "D": "3 : 1"}, "answer": "C"}, {"id": 59, "section": "Physics", "q": "The ratio of the volume of a nucleus to the total volume of an atom is of the order of:", "options": {"A": "10⁻⁵", "B": "10⁻¹⁰", "C": "10⁻¹⁵", "D": "10⁻²⁰"}, "answer": "C"}, {"id": 60, "section": "Physics", "q": "Cadmium and boron control rods in a nuclear reactor serve the function of:", "options": {"A": "Accelerating neutrons", "B": "Absorbing neutrons", "C": "Emitting γ-rays", "D": "Cooling fluid"}, "answer": "B"}, {"id": 61, "section": "Physics", "q": "The ionization potential of a hydrogen atom in its ground state is:", "options": {"A": "13.6 V", "B": "−13.6 V", "C": "3.4 V", "D": "10.2 V"}, "answer": "A"}, {"id": 62, "section": "Physics", "q": "The ratio of frequency of revolution of electron in 1st to 2nd Bohr orbit of H-atom is (f ∝ n⁻³):", "options": {"A": "2 : 1", "B": "4 : 1", "C": "8 : 1", "D": "16 : 1"}, "answer": "C"}, {"id": 63, "section": "Physics", "q": "If the mass defect in a nuclear formation is 0.02 u, the total binding energy released is about:", "options": {"A": "9.3 MeV", "B": "18.6 MeV", "C": "1.86 MeV", "D": "186 MeV"}, "answer": "B"}, {"id": 64, "section": "Physics", "q": "Magnetic field produced at nucleus due to electron revolving in Bohr orbit varies as:", "options": {"A": "B ∝ n⁻³", "B": "B ∝ n⁻⁵", "C": "B ∝ n⁻²", "D": "B ∝ n⁻⁴"}, "answer": "B"}, {"id": 65, "section": "Physics", "q": "Nuclear fusion requires extremely high temperatures (thermonuclear fusion) because:", "options": {"A": "Nuclear force repels", "B": "Coulomb repulsion of nuclei", "C": "Neutrons absorb energy", "D": "High mass of electrons"}, "answer": "B"}, {"id": 66, "section": "Physics", "q": "One Curie (1 Ci) corresponds to an activity of:", "options": {"A": "10⁶ Bq", "B": "3.7 × 10⁷ Bq", "C": "3.7 × 10¹⁰ Bq", "D": "1.6 × 10¹⁹ Bq"}, "answer": "C"}, {"id": 67, "section": "Physics", "q": "In binding energy per nucleon (B/A) vs mass number curve, maximum stability peaks around:", "options": {"A": "A = 2 (2H)", "B": "A = 56 (56Fe)", "C": "A = 100", "D": "A = 238 (238U)"}, "answer": "B"}, {"id": 68, "section": "Physics", "q": "For an alpha particle, charge q and mass m compared to proton (e, mp) are:", "options": {"A": "+2e, 2mp", "B": "+2e, 4mp", "C": "+1e, 2mp", "D": "+4e, 2mp"}, "answer": "B"}, {"id": 69, "section": "Physics", "q": "Which of the following pairs represents mirror nuclei (exchanging Z and N)?", "options": {"A": "6C14 and 7N14", "B": "3Li7 and 4Be7", "C": "1H3 and 2He4", "D": "6C12 and 6C13"}, "answer": "B"}, {"id": 70, "section": "Physics", "q": "An isolated free neutron undergoes β-decay into proton, electron, and antineutrino with mean life of:", "options": {"A": "~1 second", "B": "~15 minutes (approx. 900 s)", "C": "10⁻⁸ s", "D": "Infinite (stable)"}, "answer": "B"}, {"id": 71, "section": "Mathematics", "q": "If f(x) = sin 3x / x for x ≠ 0 is continuous at x = 0, then what is the value of f(0)?", "options": {"A": "1", "B": "3", "C": "1/3", "D": "0"}, "answer": "B"}, {"id": 72, "section": "Mathematics", "q": "The slope of the normal to the curve y = 2x² + 3 sin x at x = 0 is:", "options": {"A": "3", "B": "1/3", "C": "−3", "D": "−1/3"}, "answer": "D"}, {"id": 73, "section": "Mathematics", "q": "If y = log(sec x + tan x), then dy/dx is equal to:", "options": {"A": "sec x", "B": "tan x", "C": "sec x tan x", "D": "sec2 x"}, "answer": "A"}, {"id": 74, "section": "Mathematics", "q": "The rate of change of the area of a circle with respect to its radius r at r = 6 cm is:", "options": {"A": "10π cm²/cm", "B": "12π cm²/cm", "C": "8π cm²/cm", "D": "11π cm²/cm"}, "answer": "B"}, {"id": 75, "section": "Mathematics", "q": "The function f(x) = |x − 2| is:", "options": {"A": "Continuous and differentiable at x = 2", "B": "Continuous but not differentiable at x = 2", "C": "Neither continuous nor differentiable at x = 2", "D": "Differentiable but not continuous at x = 2"}, "answer": "B"}, {"id": 76, "section": "Mathematics", "q": "The interval in which the function f(x) = 2x³ − 9x² + 12x + 15 is strictly increasing is:", "options": {"A": "(1, 2)", "B": "(−∞, 1) ∪ (2, ∞)", "C": "(−∞, 1)", "D": "(2, ∞)"}, "answer": "B"}, {"id": 77, "section": "Mathematics", "q": "If x = a cos3θ and y = a sin3θ, then dy/dx is:", "options": {"A": "tan θ", "B": "− tan θ", "C": "cot θ", "D": "− cot θ"}, "answer": "B"}, {"id": 78, "section": "Mathematics", "q": "If the function f(x) = kx + 1 for x ≤ 5 and 3x − 5 for x > 5 is continuous at x = 5, the value of k is:", "options": {"A": "9/5", "B": "5/9", "C": "2", "D": "3"}, "answer": "A"}, {"id": 79, "section": "Mathematics", "q": "The minimum value of f(x) = x + 1/x for x > 0 is:", "options": {"A": "0", "B": "1", "C": "2", "D": "−2"}, "answer": "C"}, {"id": 80, "section": "Mathematics", "q": "What is the derivative of sin−1(2x/(1 + x²)) with respect to tan−1 x?", "options": {"A": "1", "B": "2", "C": "1/2", "D": "2/(1+x²)"}, "answer": "B"}, {"id": 81, "section": "Mathematics", "q": "The point on the curve y = x² − 4x + 5 where the tangent is parallel to the x-axis is:", "options": {"A": "(2, 1)", "B": "(1, 2)", "C": "(2, −1)", "D": "(−2, 1)"}, "answer": "A"}, {"id": 82, "section": "Mathematics", "q": "If f(x) = [x], where [.] denotes the greatest integer function, then f(x) is continuous at:", "options": {"A": "x = 1", "B": "x = 0", "C": "x = 1.5", "D": "x = −2"}, "answer": "C"}, {"id": 83, "section": "Mathematics", "q": "If y = sqrt(sin x + sqrt(sin x + sqrt(sin x + ...∞))), then dy/dx is:", "options": {"A": "cos x / (2y − 1)", "B": "sin x / (2y − 1)", "C": "cos x / (1 − 2y)", "D": "sin x / (1 − 2y)"}, "answer": "A"}, {"id": 84, "section": "Mathematics", "q": "The function f(x) = x^x attains a local minimum at:", "options": {"A": "x = e", "B": "x = 1/e", "C": "x = 1", "D": "x = √e"}, "answer": "B"}, {"id": 85, "section": "Mathematics", "q": "What is the derivative of tan−1(sqrt((1 − cos x)/(1 + cos x))) with respect to x?", "options": {"A": "1", "B": "1/2", "C": "−1", "D": "−1/2"}, "answer": "B"}, {"id": 86, "section": "Mathematics", "q": "The tangent to the curve x² + y² = 25 at (3, 4) has slope:", "options": {"A": "−3/4", "B": "3/4", "C": "−4/3", "D": "4/3"}, "answer": "A"}, {"id": 87, "section": "Mathematics", "q": "If f(x) = (1 − cos 4x)/x² for x ≠ 0 and c for x = 0 is continuous at x = 0, then c equals:", "options": {"A": "4", "B": "8", "C": "16", "D": "2"}, "answer": "B"}, {"id": 88, "section": "Mathematics", "q": "A spherical balloon is expanding such that its radius increases at 2 cm/s. The rate of increase of its volume when radius is 5 cm is:", "options": {"A": "100π cm³/s", "B": "200π cm³/s", "C": "50π cm³/s", "D": "400π cm³/s"}, "answer": "B"}, {"id": 89, "section": "Mathematics", "q": "If x^y = e^(x−y), then dy/dx is:", "options": {"A": "log x / (1 + log x)2", "B": "1 / (1 + log x)2", "C": "log x / (1 + log x)", "D": "x log x / (1 + log x)2"}, "answer": "A"}, {"id": 90, "section": "Mathematics", "q": "The function f(x) = cos x is strictly decreasing in the interval:", "options": {"A": "(0, π)", "B": "(π, 2π)", "C": "(0, 2π)", "D": "(−π, 0)"}, "answer": "A"}, {"id": 91, "section": "Mathematics", "q": "If y = sin(ax + b), then d²y/dx² is:", "options": {"A": "−a² sin(ax + b)", "B": "a² sin(ax + b)", "C": "−a cos(ax + b)", "D": "a² cos(ax + b)"}, "answer": "A"}, {"id": 92, "section": "Mathematics", "q": "The maximum value of sin x + cos x is:", "options": {"A": "1", "B": "2", "C": "√2", "D": "√(1/2)"}, "answer": "C"}, {"id": 93, "section": "Mathematics", "q": "The value of c in Rolle's Theorem for f(x) = x² − 4x + 3 on [1, 3] is:", "options": {"A": "1", "B": "2", "C": "3", "D": "0"}, "answer": "B"}, {"id": 94, "section": "Mathematics", "q": "If f(x) = loge|x|, then f'(x) for x ≠ 0 is:", "options": {"A": "1/|x|", "B": "1/x", "C": "−1/x", "D": "Does not exist"}, "answer": "B"}, {"id": 95, "section": "Mathematics", "q": "The line y = mx + 1 is a tangent to the curve y² = 4x if m equals:", "options": {"A": "1", "B": "2", "C": "1/2", "D": "4"}, "answer": "A"}, {"id": 96, "section": "Mathematics", "q": "What is the value of limx→0 (e^x − e^−x)/x?", "options": {"A": "0", "B": "1", "C": "2", "D": "e"}, "answer": "C"}, {"id": 97, "section": "Mathematics", "q": "If y = x² + 3x − 4, what is the percentage increase in y as x increases from 2 to 2.02?", "options": {"A": "1.5%", "B": "2.33%", "C": "2.0%", "D": "2.5%"}, "answer": "B"}, {"id": 98, "section": "Mathematics", "q": "The function f(x) = x³ − 3x² + 3x − 100 is:", "options": {"A": "Strictly increasing for all x ∈ R", "B": "Strictly decreasing for all x ∈ R", "C": "Increasing only in (1, ∞)", "D": "Neither increasing nor decreasing"}, "answer": "A"}, {"id": 99, "section": "Mathematics", "q": "If f(x) = x/|x| for x ≠ 0 and 0 for x = (−2, 0)", "C": "(2, ∞)", "D": "(0, 2)"}, "answer": "D"}, {"id": 109, "section": "Mathematics", "q": "If y = cos−1((1 − x²)/(1 + x²)) for 0 < x < 1, then dy/dx is:", "options": {"A": "2/(1 + x²)", "B": "−2/(1 + x²)", "C": "1/(1 + x²)", "D": "−1/(1 + x²)"}, "answer": "A"}, {"id": 110, "section": "Mathematics", "q": "The perimeter of a rectangle of greatest area that can be inscribed in a circle of radius r is:", "options": {"A": "4r", "B": "4√2 r", "C": "2√2 r", "D": "8r"}, "answer": "B"}, {"id": 111, "section": "Mathematics", "q": "The value of c guaranteed by Lagrange's Mean Value Theorem for f(x) = √(x − 2) on [2, 6] is:", "options": {"A": "3", "B": "4", "C": "5", "D": "3.5"}, "answer": "A"}, {"id": 112, "section": "Mathematics", "q": "If f(x) = x sin(1/x) for x ≠ 0 and 0 for x = 0, then at x = 0:", "options": {"A": "f(x) is continuous and differentiable", "B": "f(x) is continuous but not differentiable", "C": "f(x) is differentiable but not continuous", "D": "f(x) is neither continuous nor differentiable"}, "answer": "B"}, {"id": 113, "section": "Mathematics", "q": "If y = sin−1x, then (1 − x²) d²y/dx² − x dy/dx equals:", "options": {"A": "0", "B": "1", "C": "−1", "D": "y"}, "answer": "A"}, {"id": 114, "section": "Mathematics", "q": "The curve y = x^(1/5) at x = 0 has:", "options": {"A": "A horizontal tangent", "B": "A vertical tangent", "C": "No tangent", "D": "An oblique tangent"}, "answer": "B"}, {"id": 115, "section": "Mathematics", "q": "The critical point(s) of f(x) = |x−1|+|x−3| is/are:", "options": {"A": "Only x = 1", "B": "Only x = 3", "C": "x = 1 and x = 3", "D": "Every point in [1, 3]"}, "answer": "D"}, {"id": 116, "section": "Mathematics", "q": "If √x + √y = 1, then dy/dx at (1/4, 1/4) is:", "options": {"A": "1", "B": "−1", "C": "2", "D": "−2"}, "answer": "B"}, {"id": 117, "section": "Mathematics", "q": "A stone is dropped into a quiet lake and waves move in circles at a speed of 4 cm/s. At the instant when the radius is 10 cm, how fast is the enclosed : {"A": "x = 2", "B": "x = 3", "C": "x = 1", "D": "x = 5"}, "answer": "C"}, {"id": 127, "section": "Mathematics", "q": "If y = loga x, then dy/dx is:", "options": {"A": "1/x", "B": "1/(x ln a)", "C": "ln a / x", "D": "x / ln a"}, "answer": "B"}, {"id": 128, "section": "Mathematics", "q": "If f(x) = 2x − 1 for x < 2 and 3x² for x ≥ 2, then f'(2) is:", "options": {"A": "2", "B": "3/2", "C": "Does not exist", "D": "0"}, "answer": "C"}, {"id": 129, "section": "Mathematics", "q": "The equation of the normal to the curve y = x³ at the point (1, 1) is:", "options": {"A": "x + 3y − 4 = 0", "B": "3x + y − 4 = 0", "C": "x − 3y + 2 = 0", "D": "3x − y − 2 = 0"}, "answer": "A"}, {"id": 130, "section": "Mathematics", "q": "The maximum value of (1/x)^x is:", "options": {"A": "e^(1/e)", "B": "e", "C": "(1/e)^e", "D": "1"}, "answer": "A"}, {"id": 131, "section": "Mathematics", "q": "If x = a(θ − sin θ) and y = a(1 − cos θ), then dy/dx at θ = π/2 is:", "options": {"A": "0", "B": "1", "C": "−1", "D": "√3"}, "answer": "B"}, {"id": 132, "section": "Mathematics", "q": "If f(x) = x² on [0, 2], the value of c satisfying LMVT is:", "options": {"A": "1", "B": "√2", "C": "1/2", "D": "3/2"}, "answer": "A"}, {"id": 133, "section": "Mathematics", "q": "If y = 5 cos x − 3 sin x, then d²y/dx² + y is equal to:", "options": {"A": "0", "B": "1", "C": "2y", "D": "−2y"}, "answer": "A"}, {"id": 134, "section": "Mathematics", "q": "The function f(x) = log(1+x) − 2x/(2 + x) is increasing for:", "options": {"A": "All x", "B": "x > 0", "C": "x < 0", "D": "x > −1"}, "answer": "B"}, {"id": 135, "section": "Mathematics", "q": "What is the derivative of e^(sin x) with respect to cos x?", "options": {"A": "−e^(sin x) cot x", "B": "e^(sin x) cot x", "C": "−e^(sin x) tan x", "D": "e^(sin x) cos x"}, "answer": "A"}, {"id": 136, "section": "Mathematics", "q": "The line x+y = 2 is tangent to the curve x² = 2−y at the point:", "options": {"A": "(1, 1)", "B": "(0, 2)", "C": "(2, 0)", "D": "(−1, 1)"}, "answer": "A"}, {" ": "3° > 1° > 2°"}, "answer": "A"}, {"id": 146, "section": "Chemistry", "q": "What is the coordination number and oxidation state of cobalt in [Co(en)2Cl2]+?", "options": {"A": "4, +2", "B": "6, +3", "C": "6, +2", "D": "4, +3"}, "answer": "B"}, {"id": 147, "section": "Chemistry", "q": "Chlorobenzene on heating with concentrated HNO3 and concentrated H2SO4 gives majorly:", "options": {"A": "1-Chloro-2-nitrobenzene", "B": "1-Chloro-4-nitrobenzene", "C": "1-Chloro-3-nitrobenzene", "D": "1,4-Dinitrobenzene"}, "answer": "B"}, {"id": 148, "section": "Chemistry", "q": "The ligand EDTA4− is a:", "options": {"A": "Bidentate ligand", "B": "Tetradentate ligand", "C": "Hexadentate ligand", "D": "Tridentate ligand"}, "answer": "C"}, {"id": 149, "section": "Chemistry", "q": "How many ions are produced per formula unit in aqueous solution from the complex [Co(NH3)5Cl]Cl2?", "options": {"A": "2", "B": "3", "C": "4", "D": "1"}, "answer": "B"}, {"id": 150, "section": "Chemistry", "q": "Which of the following compounds reacts fastest with Lucas reagent (conc. HCl + anhy. ZnCl2)?", "options": {"A": "Butan-1-ol", "B": "Butan-2-ol", "C": "2-Methylpropan-2-ol", "D": "Propan-1-ol"}, "answer": "C"}, {"id": 151, "section": "Chemistry", "q": "Which of the following ligands produces a linkage isomer when coordinating with transition metals?", "options": {"A": "NH3", "B": "H2O", "C": "SCN−", "D": "Cl−"}, "answer": "C"}, {"id": 152, "section": "Chemistry", "q": "Haloalkanes are insoluble in water primarily because:", "options": {"A": "They are non-polar compounds", "B": "They cannot form hydrogen bonds with water molecules", "C": "They have higher molecular mass than water", "D": "They form covalent aggregates in water"}, "answer": "B"}, {"id": 153, "section": "Chemistry", "q": "The spin-only magnetic moment (μs) of [Mn(CN)6]3− (low spin complex) is:", "options": {"A": "2.83 BM", "B": "4.90 BM", "C": "1.73 BM", "D": "3.87 BM"}, "answer": "A"}, {"id": 154, "section": "Chemistry", "q": "Which gas is liberated when chloroform is exposed to air and sunlight?", "options": {"A": "Mustard gas", "B": "Phosgene (COCl2)", "C": "Tear gas", "D": "Lewisite"}, "answer": "B"}, {"id": 155, "section": "Chemistry", "q": "Which of the following pairs of compounds represents enantiomers?", "options": {"A": "Non-superimposable mirror images", "B": "Superimposable mirror images", "C": "Non-mirror image stereoisomers", "D": "Structural position isomers"}, "answer": "A"}, {"id": 156, "section": "Chemistry", "q": "The oxidation state of nickel in [Ni(CO)4] is:", "options": {"A": "0", "B": "+2", "C": "+4", "D": "−2"}, "answer": "A"}, {"id": 157, "section": "Chemistry", "q": "The conversion of alkyl bromide into alkyl iodide using sodium iodide in dry acetone is called:", "options": {"A": "Swarts reaction", "B": "Finkelstein reaction", "C": "Sandmeyer reaction", "D": "Wurtz-Fittig reaction"}, "answer": "B"}, {"id": 158, "section": "Chemistry", "q": "Which of the following octahedral complexes exhibits optical isomerism?", "options": {"A": "trans-[Co(en)2Cl2]+", "B": "cis-[Co(en)2Cl2]+", "C": "[Co(NH3)4Cl2]+", "D": "[Cr(NH3)5Cl]2+"}, "answer": "B"}, {"id": 159, "section": "Chemistry", "q": "An alkyl halide R-X reacts with KCN to give nitrile as major product, while with AgCN it gives isonitrile because:", "options": {"A": "KCN is covalent and AgCN is ionic", "B": "KCN is ionic providing free C attack, while AgCN is covalent with free N lone pair", "C": "AgCN is a weaker nucleophile", "D": "KCN reacts via SN1 exclusively"}, "answer": "B"}, {"id": 160, "section": "Chemistry", "q": "The geometry of [Ni(CN)4]2− is:", "options": {"A": "Tetrahedral", "B": "Square planar", "C": "Octahedral", "D": "Trigonal bipyramidal"}, "answer": "B"}, {"id": 161, "section": "Chemistry", "q": "Which of the following is most reactive towards nucleophilic aromatic substitution?", "options": {"A": "Chlorobenzene", "B": "2-Nitrochlorobenzene", "C": "4-Nitrochlorobenzene", "D": "2,4,6-Trinitrochlorobenzene"}, "answer": "D"}, {"id": 162, "section": "Chemistry", "q": "The formula of potassium trioxalatoferrate(III) is:", "options": {"A": "K3[Fe(C2O4)3]", "B": "K2[Fe(C2O4)3]", "C": "K[Fe(C2O4)3]", "D": "K3[Fe(C2O4)2]"}, "answer": "A"}, {"id": 163, "section": "Chemistry", "q": "What is the major product obtained when 2-bromobutane is treated with alcoholic KOH?", "options": {"A": "But-1-ene", "B": "But-2-ene", "C": "Butan-2-ol", "D": "Butan-1-ol"}, "answer": "B"}, {"id": 164, "section": "Chemistry", "q": "According to Crystal Field Theory, an octahedral weak-field d5 configuration has:", "options": {"A": "t2g3 eg2", "B": "t2g4 eg1", "C": "t2g5 eg0", "D": "t2g2 eg3"}, "answer": "A"}, {"id": 165, "section": "Chemistry", "q": "The correct order of boiling points of the following isomeric halobutanes is:", "options": {"A": "n-butyl chloride > isobutyl chloride > tert-butyl chloride", "B": "tert-butyl chloride > isobutyl chloride > n-butyl chloride", "C": "isobutyl chloride > n-butyl chloride > tert-butyl chloride", "D": "tert-butyl chloride > n-butyl chloride > isobutyl chloride"}, "answer": "A"}, {"id": 166, "section": "Chemistry", "q": "A coordinate complex that exhibits coordination isomerism is:", "options": {"A": "[Co(NH3)6][Cr(CN)6]", "B": "[Co(NH3)5(NO2)]Cl2", "C": "[Pt(NH3)2Cl2]", "D": "[Co(NH3)5(SO4)]Br"}, "answer": "A"}, {"id": 167, "section": "Chemistry", "q": "Reaction of an aryl halide with an alkyl halide and sodium in dry ether to give alkylbenzene is termed:", "options": {"A": "Fittig reaction", "B": "Wurtz-Fittig reaction", "C": "Sandmeyer reaction", "D": "Ullmann reaction"}, "answer": "B"}, {"id": 168, "section": "Chemistry", "q": "Which of the following behaves as an ambidentate nucleophile?", "options": {"A": "OH−", "B": "NO2−", "C": "NH3", "D": "RO−"}, "answer": "B"}, {"id": 169, "section": "Chemistry", "q": "The number of unpaired electrons in the tetrahedral complex [NiCl4]2− is:", "options": {"A": "0", "B": "1", "C": "2", "D": "4"}, "answer": "C"}, {"id": 170, "section": "Chemistry", "q": "Chloroform is preserved in dark brown bottles containing 1% ethanol because ethanol:", "options": {"A": "Acts as an oxidizing agent", "B": "Converts poisonous phosgene into harmless ethyl carbonate", "C": "Prevents light from entering the solution", "D": "Accelerates evaporation of chloroform"}, "answer": "B"}, {"id": 171, "section": "Chemistry", "q": "Which of the following alkyl halides undergoes racemization upon substitution by aqueous KOH?", "options": {"A": "(+)-2-Bromobutane", "B": "1-Bromobutane", "C": "1-Bromo-2-methylpropane", "D": "Bromomethane"}, "answer": "A"}, {"id": 172, "section": "Chemistry", "q": "The crystal field splitting energy for a tetrahedral complex (Δt) is related to that of an octahedral complex (Δo) by:", "options": {"A": "Δt = (4/9)Δo", "B": "Δt = (9/4)Δo", "C": "Δt = (1/2)Δo", "D": "Δt = (3/5)Δo"}, "answer": "A"}, {"id": 173, "section": "Chemistry", "q": "The secondary valency of platinum in [Pt(en)2Cl2] is:", "options": {"A": "2", "B": "4", "C": "6", "D": "8"}, "answer": "C"}, {"id": 174, "section": "Chemistry", "q": "The IUPAC name of the compound CH3–CH(Cl)–CH2–CH3 is:", "options": {"A": "2-Chlorobutane", "B": "3-Chlorobutane", "C": "sec-Butyl chloride", "D": "1-Methyl-1-chloropropane"}, "answer": "A"}, {"id": 175, "section": "Chemistry", "q": "Which of the following species has square planar shape?", "options": {"A": "[Ni(CO)4]", "B": "[NiCl4]2−", "C": "[Pt(NH3)4]2+", "D": "[Zn(NH3)4]2+"}, "answer": "C"}, {"id": 176, "section": "Chemistry", "q": "Which method is used to prepare alkyl fluorides from alkyl chlorides?", "options": {"A": "Finkelstein reaction", "B": "Swarts reaction", "C": "Wurtz reaction", "D": "Hunsdiecker reaction"}, "answer": "B"}, {"id": 177, "section": "Chemistry", "q": "What is the coordination entity when excess ammonia is added to an aqueous solution of copper sulphate?", "options": {"A": "[Cu(NH3)2]2+", "B": "[Cu(NH3)4]2+", "C": "[Cu(NH3)6]2+", "D": "[Cu(NH3)3]2+"}, "answer": "B"}, {"id": 178, "section": "Chemistry", "q": "gem-Dibromide among the following is:", "options": {"A": "CH3–CH(Br)–CH2Br", "B": "CH3–CH(Br)2", "C": "Br–CH2–CH2–CH2–Br", "D": "CH2Br–CH2Br"}, "answer": "B"}, {"id": 179, "section": "Chemistry", "q": "Which of the following complexes shows fac-mer (facial-meridional) isomerism?", "options": {"A": "[Co(NH3)3(NO2)3]", "B": "[Co(NH3)4Cl2]+", "C": "[Pt(NH3)2Cl2]", "D": "[Co(en)3]3+"}, "answer": "A"}, {"id": 180, "section": "Chemistry", "q": "When chlorobenzene is heated with chloral in presence of concentrated H2SO4, the product formed is:", "options": {"A": "BHC", "B": "DDT", "C": "Gammaxene", "D": "Freon-11"}, "answer": "B"}, {"id": 181, "section": "Chemistry", "q": "The product of the reaction between methyl magnesium bromide and heavy water (D2O) is:", "options": {"A": "CH4", "B": "CH3OD", "C": "CH3D", "D": "Mg(OD)Br only"}, "answer": "C"}, {"id": 182, "section": "Chemistry", "q": "In [Fe(H2O)5(NO)]SO4, the oxidation state of iron and the charge on NO ligand are respectively:", "options": {"A": "+1 and +1", "B": "+2 and 0", "C": "+3 and −1", "D": "+1 and 0"}, "answer": "A"}, {"id": 183, "section": "Chemistry", "q": "Which of the following alkyl halides is most reactive towards SN1 solvolysis?", "options": {"A": "Benzyl chloride", "B": "Chlorobenzene", "C": "Vinyl chloride", "D": "Ethyl chloride"}, "answer": "A"}, {"id": 184, "section": "Chemistry", "q": "The IUPAC name of K3[Fe(CN)6] is:", "options": {"A": "Potassium hexacyanoferrate(II)", "B": "Potassium hexacyanoferrate(III)", "C": "Potassium ferricyanide", "D": "Tripotassium hexacyanoiron(III)"}, "answer": "B"}, {"id": 185, "section": "Chemistry", "q": "The hybridisation of cobalt in the diamagnetic complex ion [Co(NH3)6]3+ is:", "options": {"A": "sp3d2", "B": "d2sp3", "C": "dsp2", "D": "sp3d"}, "answer": "B"}, {"id": 186, "section": "Chemistry", "q": "Which among the following compounds has the highest boiling point?", "options": {"A": "CH3F", "B": "CH3Cl", "C": "CH3Br", "D": "CH3I"}, "answer": "D"}, {"id": 187, "section": "Chemistry", "q": "Which reagent converts propene to 1-bromopropane in anti-Markovnikov fashion?", "options": {"A": "HBr in presence of peroxide", "B": "HCl in presence of peroxide", "C": "HBr in absence of peroxide", "D": "HI in presence of peroxide"}, "answer": "A"}, {"id": 188, "section": "Chemistry", "q": "Cisplatin, an anticancer drug, has the chemical formula:", "options": {"A": "cis-[Pt(NH3)2Cl2]", "B": "trans-[Pt(NH3)2Cl2]", "C": "cis-[Pt(NH3)4]Cl2", "D": "cis-[PtCl4]2−"}, "answer": "A"}, {"id": 189, "section": "Chemistry", "q": "The type of isomerism displayed by [Co(NH3)5(SO4)]Br and [Co(NH3)5Br]SO4 is:", "options": {"A": "Linkage isomerism", "B": "Ionization isomerism", "C": "Coordination isomerism", "D": "Solvate isomerism"}, "answer": "B"}, {"id": 190, "section": "Chemistry", "q": "Grignard reagents are not prepared in aqueous medium because:", "options": {"A": "Water decomposes them into hydrocarbons", "B": "Magnesium does not react with alkyl halide in water", "C": "Water reacts violently with alkyl halide", "D": "The reaction becomes highly endothermic"}, "answer": "A"}, {"id": 191, "section": "Chemistry", "q": "Which of the following compounds gives a positive carbylamine test?", "options": {"A": "Ethylamine", "B": "Diethylamine", "C": "Triethylamine", "D": "N-Methylaniline"}, "answer": "A"}, {"id": 192, "section": "Chemistry", "q": "The total number of ions produced by 1 mole of [Pt(NH3)4Cl2]Cl2 in water is:", "options": {"A": "2", "B": "3", "C": "4", "D": "5"}, "answer": "B"}, {"id": 193, "section": "Chemistry", "q": "In haloarenes, the carbon attached to halogen is hybridized as:", "options": {"A": "sp", "B": "sp2", "C": "sp3", "D": "dsp2"}, "answer": "B"}, {"id": 194, "section": "Chemistry", "q": "Which of the following ligands is a neutral molecule?", "options": {"A": "Carbonyl (CO)", "B": "Cyano (CN−)", "C": "Nitro (NO2−)", "D": "Oxalato (C2O4 2−)"}, "answer": "A"}, {"id": 195, "section": "Chemistry", "q": "The reaction of chlorobenzene with NaOH at 623 K and 300 atm followed by acidification yields:", "options": {"A": "Benzoic acid", "B": "Phenol", "C": "Benzophenone", "D": "Aniline"}, "answer": "B"}, {"id": 196, "section": "Chemistry", "q": "What is the magnetic behavior of [Ni(CO)4]?", "options": {"A": "Paramagnetic with 2 unpaired electrons", "B": "Diamagnetic", "C": "Ferromagnetic", "D": "Paramagnetic with 4 unpaired electrons"}, "answer": "B"}, {"id": 197, "section": "Chemistry", "q": "The conversion of chlorobenzene to diphenyl by reacting with sodium in dry ether is called:", "options": {"A": "Wurtz reaction", "B": "Fittig reaction", "C": "Wurtz-Fittig reaction", "D": "Frankland reaction"}, "answer": "B"}, {"id": 198, "section": "Chemistry", "q": "Which of the following forms a colored precipitate with AgNO3 immediately at room temperature?", "options": {"A": "Chlorobenzene", "B": "Benzyl chloride", "C": "Allyl iodide", "D": "Vinyl chloride"}, "answer": "C"}, {"id": 199, "section": "Chemistry", "q": "The CFSE value for a d6 high spin octahedral complex is:", "options": {"A": "−0.4 Δo", "B": "−0.6 Δo", "C": "−2.4 Δo + 2P", "D": "0 Δo"}, "answer": "A"}, {"id": 200, "section": "Chemistry", "q": "Which compound is commonly known as Freon-12?", "options": {"A": "CF4", "B": "CF2Cl2", "C": "CFCl3", "D": "CH2F2"}, "answer": "B"}]</script>

<script>
/* ===================== Seamate IMUCET Mock Test ===================== */
(function(){
"use strict";

const QUESTIONS = JSON.parse(document.getElementById('questions-data').textContent);
const TOTAL_Q = QUESTIONS.length; // 200
const DURATION_SEC = 180 * 60; // 3 hours
const SECTION_ORDER = ['Physics','Mathematics','Chemistry'];
const SECTION_COUNTS = {};
SECTION_ORDER.forEach(s => SECTION_COUNTS[s] = QUESTIONS.filter(q=>q.section===s).length);
const ADMIN_WA_DISPLAY = '8116217554';
const ADMIN_WA_INTL = '918116217554';
const ADMIN_PASSWORD = 'seamate@2026';
const PASS_PERCENT = 40;
const MARK_CORRECT = 1, MARK_WRONG = -0.25;
const violationLimit = 3; // warnings; the (limit+1)th switch auto-submits

/* ---- Google Sheets shared database (existing Seamate Apps Script deployment) ---- */
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzi-phGaX3GLUuFes8-Yu99BoClWeeF0zUO6g6-655Xoj7Zi3DMtJVPV19KJrEgwsPuIw/exec";

function formatTimeForDatabase(sec) {
  sec = Math.max(0, Number(sec) || 0);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}m ${s}s`;
}

function sendResultToGoogleSheets(record) {
  try {
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(record),
      keepalive: true
    })
    .then(() => {
      console.log("Google Sheets result request sent.");
    })
    .catch(error => {
      console.error("Google Sheets sync error:", error);
    });
  } catch (error) {
    console.error("Google Sheets sync error:", error);
  }
}

let db = null, downloadsCap = null;
async function initCapabilities(){
  try{ if(window.claude && window.claude.use){ db = await window.claude.use('db'); } }catch(e){ db = null; }
  try{ if(window.claude && window.claude.use){ downloadsCap = await window.claude.use('downloads'); } }catch(e){ downloadsCap = null; }
}
initCapabilities();

const root = document.getElementById('app');

/* ---------------- State ---------------- */
function freshState(){
  return {
    screen: 'register',
    student: { name:'', mobile:'', email:'' },
    resultId: null,
    startedAt: null,
    submittedAt: null,
    current: 0,
    answers: {},      // id -> 'A'|'B'|'C'|'D'
    visited: {},       // id -> true
    marked: {},         // id -> true
    timeLeft: DURATION_SEC,
    violations: { tabSwitches:0, copyAttempts:0, rightClicks:0, consoleAttempts:0, fullscreenExits:0 },
    warningsGiven: 0,
    autoSubmitReason: null,
    navFilter: 'All'
  };
}
let S = freshState();

function saveSession(){
  try{ sessionStorage.setItem('seamate_exam_state', JSON.stringify(S)); }catch(e){}
}
function loadSession(){
  try{
    const raw = sessionStorage.getItem('seamate_exam_state');
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.screen){ S = parsed; } }
  }catch(e){}
}
loadSession();

/* ---------------- helpers ---------------- */
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return h+':'+m+':'+s;
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function qById(id){ return QUESTIONS[id-1]; }

function render(){
  saveSession();
  root.innerHTML = '';
  if(S.screen==='register') renderRegister();
  else if(S.screen==='instructions') renderInstructions();
  else if(S.screen==='exam') renderExam();
  else if(S.screen==='result') renderResult();
  else if(S.screen==='adminlogin') renderAdminLogin();
  else if(S.screen==='admin') renderAdmin();
  window.scrollTo(0,0);
}

/* ===================== Registration ===================== */
function renderRegister(){
  const wrap = el('div','app-shell');
  const c = el('div','center-wrap');
  const card = el('div','card auth-card');
  card.innerHTML = `
    <div class="brand-row">
      <img src="LOGO_SRC" class="brand-logo" alt="Seamate logo">
    </div>
    <h1><span class="accent">Seamate</span> IMUCET Mock Test</h1>
    <p class="auth-sub">Registration &middot; 200 Questions &middot; Physics, Mathematics &amp; Chemistry &middot; 180 minutes</p>
    <div id="reg-form">
      <div class="field" id="f-name">
        <label>Full Name</label>
        <input type="text" id="in-name" placeholder="As per your ID" autocomplete="name">
        <div class="err">Please enter your name.</div>
      </div>
      <div class="field" id="f-mobile">
        <label>Mobile Number</label>
        <input type="tel" id="in-mobile" placeholder="10-digit mobile number" autocomplete="tel" inputmode="numeric" maxlength="10">
        <div class="err">Enter a valid 10-digit mobile number.</div>
      </div>
      <div class="field" id="f-email">
        <label>Email Address <span style="color:var(--danger)">*</span></label>
        <input type="email" id="in-email" placeholder="you@example.com" autocomplete="email">
        <div class="hint">Mandatory &mdash; used to identify your result.</div>
        <div class="err">Enter a valid email address.</div>
      </div>
      <button class="btn btn-primary" id="btn-proceed">Proceed to Instructions</button>
    </div>
    <div style="text-align:center;margin-top:16px;">
      <a href="#" id="admin-link" style="font-size:.74rem;color:var(--ink-soft);">Admin Login</a>
    </div>
  `;
  card.innerHTML = card.innerHTML.replace('LOGO_SRC', window.__LOGO_SRC__);
  c.appendChild(card);
  wrap.appendChild(c);
  root.appendChild(wrap);

  document.getElementById('in-name').value = S.student.name;
  document.getElementById('in-mobile').value = S.student.mobile;
  document.getElementById('in-email').value = S.student.email;

  document.getElementById('admin-link').addEventListener('click', (e)=>{
    e.preventDefault(); S.screen='adminlogin'; render();
  });

  document.getElementById('btn-proceed').addEventListener('click', ()=>{
    const name = document.getElementById('in-name').value.trim();
    const mobile = document.getElementById('in-mobile').value.trim();
    const email = document.getElementById('in-email').value.trim();
    let ok = true;
    toggleInvalid('f-name', name.length < 2); if(name.length<2) ok=false;
    const mobileOk = /^\d{10}$/.test(mobile);
    toggleInvalid('f-mobile', !mobileOk); if(!mobileOk) ok=false;
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    toggleInvalid('f-email', !emailOk); if(!emailOk) ok=false;
    if(!ok) return;
    S.student = { name, mobile, email };
    S.screen = 'instructions';
    render();
  });
}
function toggleInvalid(id, isInvalid){
  document.getElementById(id).classList.toggle('invalid', isInvalid);
}

/* ===================== Instructions ===================== */
function renderInstructions(){
  const wrap = el('div','app-shell');
  const c = el('div','center-wrap');
  const card = el('div','card instr-card');
  card.innerHTML = `
    <div class="brand-row">
      <img src="${window.__LOGO_SRC__}" class="brand-logo" alt="Seamate logo">
    </div>
    <h1>Instructions &mdash; Read Carefully</h1>
    <div class="instr-grid">
      <div class="instr-stat"><div class="k">Total Questions</div><div class="v">${TOTAL_Q}</div></div>
      <div class="instr-stat"><div class="k">Duration</div><div class="v">180 minutes (3 hours)</div></div>
      <div class="instr-stat"><div class="k">Physics</div><div class="v">${SECTION_COUNTS.Physics} questions</div></div>
      <div class="instr-stat"><div class="k">Mathematics</div><div class="v">${SECTION_COUNTS.Mathematics} questions</div></div>
      <div class="instr-stat"><div class="k">Chemistry</div><div class="v">${SECTION_COUNTS.Chemistry} questions</div></div>
      <div class="instr-stat"><div class="k">Marking Scheme</div><div class="v">+1 / −0.25 / 0</div></div>
    </div>
    <ol class="instr-list">
      <li><span class="num">1</span><span>The test has <b>${TOTAL_Q} questions</b> across three sections &mdash; Physics, Mathematics and Chemistry &mdash; to be completed in <b>180 minutes</b>. The timer starts the moment Question 1 appears.</span></li>
      <li><span class="num">2</span><span>Marking scheme: <b>+1</b> for every correct answer, <b>&minus;0.25</b> for every incorrect answer, and <b>0</b> for unattempted questions.</span></li>
      <li><span class="num">3</span><span>Only one question is shown per page. Use <b>Next</b>, <b>Previous</b> or the question grid to move between questions &mdash; there is no continuous scrolling through questions.</span></li>
      <li><span class="num">4</span><span>Use <b>Mark for Review</b> to flag a question and come back to it later, and <b>Clear Response</b> to remove your selected answer.</span></li>
      <li><span class="num">5</span><span><b>Anti-cheating policy:</b> switching tabs / leaving the exam window will trigger a warning. You get <b>up to 3 warnings</b> &mdash; the <b>4th</b> tab switch will <b>auto-submit</b> your test immediately.</span></li>
      <li><span class="num">6</span><span>Copying text and right-clicking are disabled during the test. All such attempts are logged and shown on your result as part of the Anti-Cheating Report.</span></li>
      <li><span class="num">7</span><span>After submission, tap <b>Share with Admin</b> on your result page to send your performance summary directly to the official admin WhatsApp number.</span></li>
      <li><span class="num">8</span><span>The consolidated leaderboard is compiled and released by the admin the <b>next day</b> &mdash; it is not shown immediately after your test.</span></li>
    </ol>
    <div class="instr-warn">
      <b>Official admin WhatsApp:</b> ${ADMIN_WA_DISPLAY} &mdash; save this number. Results are only valid when shared with this number; the admin does not delete results from this chat, so keep your share receipt as proof of submission.
    </div>
    <label class="ack-row">
      <input type="checkbox" id="ack-box">
      <span>I have read and understood the instructions above, including the anti-cheating and marking policy, and I am ready to begin the test.</span>
    </label>
    <button class="btn btn-primary" id="btn-start" disabled>Start Exam</button>
  `;
  c.appendChild(card);
  wrap.appendChild(c);
  root.appendChild(wrap);

  document.getElementById('ack-box').addEventListener('change', (e)=>{
    document.getElementById('btn-start').disabled = !e.target.checked;
  });
  document.getElementById('btn-start').addEventListener('click', startExam);
}

/* ===================== Exam ===================== */
let timerInterval = null;
let lastViolationTs = 0;
let devtoolsFlag = false;
let examActive = false;

function startExam(){
  S.startedAt = Date.now();
  S.current = 1;
  S.visited[1] = true;
  S.screen = 'exam';
  render();
  requestFullscreenBestEffort();
  attachAntiCheat();
  examActive = true;
  timerInterval = setInterval(tick, 1000);
}
function requestFullscreenBestEffort(){
  try{
    const de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen || de.msRequestFullscreen;
    if(req) req.call(de).catch(()=>{});
  }catch(e){}
}
function tick(){
  if(S.screen!=='exam') return;
  S.timeLeft -= 1;
  const pill = document.getElementById('timer-val');
  const pillWrap = document.getElementById('timer-pill');
  if(pill){ pill.textContent = fmtTime(S.timeLeft); }
  if(pillWrap){ pillWrap.classList.toggle('low', S.timeLeft <= 300); }
  saveSession();
  if(S.timeLeft <= 0){
    S.autoSubmitReason = 'Time over';
    finishExam();
  }
}

function flagViolation(kind){
  const now = Date.now();
  if(now - lastViolationTs < 900) return; // debounce simultaneous events
  lastViolationTs = now;
  S.violations.tabSwitches += 1;
  saveSession();
  const n = S.violations.tabSwitches;
  if(n > violationLimit){
    S.autoSubmitReason = 'Anti-cheating policy violated (tab/window switched more than '+violationLimit+' times)';
    finishExam();
  } else {
    showWarningModal(n);
  }
}
function showWarningModal(n){
  const overlay = document.getElementById('warn-overlay');
  if(!overlay) return;
  document.getElementById('warn-count').textContent = n;
  document.getElementById('warn-remaining').textContent = (violationLimit - n);
  overlay.classList.add('open');
}

function onVisibilityChange(){
  if(document.hidden && examActive) flagViolation('visibility');
}
function onBlur(){
  if(examActive) flagViolation('blur');
}
function onContextMenu(e){
  if(!examActive) return;
  e.preventDefault();
  S.violations.rightClicks += 1; saveSession();
}
function onCopy(e){
  if(!examActive) return;
  e.preventDefault();
  S.violations.copyAttempts += 1; saveSession();
}
function onKeydown(e){
  if(!examActive) return;
  const k = e.key ? e.key.toLowerCase() : '';
  const blocked = (k==='f12') ||
    (e.ctrlKey && e.shiftKey && (k==='i'||k==='j'||k==='c')) ||
    (e.ctrlKey && k==='u') ||
    (e.metaKey && e.altKey && (k==='i'||k==='j'));
  if(blocked){
    e.preventDefault();
    S.violations.consoleAttempts += 1; saveSession();
  }
}
let devtoolsPoll = null;
function pollDevtools(){
  const wide = window.outerWidth - window.innerWidth > 170;
  const tall = window.outerHeight - window.innerHeight > 170;
  const open = wide || tall;
  if(open && !devtoolsFlag){
    devtoolsFlag = true;
    S.violations.consoleAttempts += 1; saveSession();
  } else if(!open && devtoolsFlag){
    devtoolsFlag = false;
  }
}
function onFullscreenChange(){
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if(!isFs && examActive){
    S.violations.fullscreenExits += 1; saveSession();
    flagViolation('fullscreen');
  }
}
function attachAntiCheat(){
  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('blur', onBlur);
  document.addEventListener('contextmenu', onContextMenu);
  document.addEventListener('copy', onCopy);
  document.addEventListener('keydown', onKeydown);
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);
  devtoolsPoll = setInterval(pollDevtools, 1500);
}
function detachAntiCheat(){
  document.removeEventListener('visibilitychange', onVisibilityChange);
  window.removeEventListener('blur', onBlur);
  document.removeEventListener('contextmenu', onContextMenu);
  document.removeEventListener('copy', onCopy);
  document.removeEventListener('keydown', onKeydown);
  document.removeEventListener('fullscreenchange', onFullscreenChange);
  document.removeEventListener('webkitfullscreenchange', onFullscreenChange);
  if(devtoolsPoll) clearInterval(devtoolsPoll);
}

function statusOf(id){
  const answered = !!S.answers[id];
  const marked = !!S.marked[id];
  const visited = !!S.visited[id];
  if(marked) return 'review';
  if(answered) return 'answered';
  if(visited) return 'notanswered';
  return 'notvisited';
}

/* ===================== Scoring ===================== */
function computeScore(){
  let correct=0, wrong=0, unattempted=0, marks=0;
  const bySection = {};
  SECTION_ORDER.forEach(s=>bySection[s]={correct:0,wrong:0,unattempted:0,total:SECTION_COUNTS[s],marks:0});
  const rows = [];
  QUESTIONS.forEach(q=>{
    const given = S.answers[q.id];
    let status;
    if(!given){ unattempted++; status='unattempted'; bySection[q.section].unattempted++; }
    else if(given === q.answer){ correct++; marks+=MARK_CORRECT; status='correct'; bySection[q.section].correct++; bySection[q.section].marks+=MARK_CORRECT; }
    else { wrong++; marks+=MARK_WRONG; status='wrong'; bySection[q.section].wrong++; bySection[q.section].marks+=MARK_WRONG; }
    rows.push({id:q.id, section:q.section, given: given||'-', correctAns: q.answer, status});
  });
  marks = Math.round(marks*100)/100;
  SECTION_ORDER.forEach(s=>bySection[s].marks = Math.round(bySection[s].marks*100)/100);
  const attempted = correct+wrong;
  const percentage = Math.round((marks/TOTAL_Q)*10000)/100;
  return {correct,wrong,unattempted,attempted,marks,percentage,bySection,rows};
}

  S._lastScore = score;

  const googleRecord = {
    resultId: S.resultId,

    phone: S.student.mobile,

    ) ? "Pass" : "Fail",

function buildReviewTable(score){
  const table = document.getElementById('review-table');

    rows += `<tr><td>${r.id}</td><td>${r.section}</td><td>${r.given}</td><td>${r.correctAns}</td><td class="${cls}">${label}</td></tr>`;
  });

function buildBarChart(bySection){
  const w=360,h=200,pad=36;
  const maxMarks = Math.max(1, ...SECTION_ORDER.map(s=>SECTION_COUNTS[s]));
  const barW = (w - pad*2) / (SECTION_ORDER.length*2);
  let bars = '';
  SECTION_ORDER.forEach((s,i)=>{
    const val = bySection[s].marks;
    const total = SECTION_COUNTS[s];
    const x = pad + i*(barW*2) + barW*0.5;
    const hgt = Math.max(2, (Math.max(val,0)/maxMarks) * (h - pad*2));
    const y = h - pad - hgt;
    const color = ['#1c3f79','#c8952e','#1e7145'][i%3];
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${hgt}" rx="3" fill="${color}"></rect>`;
    bars += `<text x="${x+barW/2}" y="${h-pad+16}" font-size="11" text-anchor="middle" fill="var(--ink-soft)">${s.slice(0,4)}</text>`;
    bars += `<text x="${x+barW/2}" y="${y-6}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">${val}</text>`;
  });
  const axisY = h-pad;
  const svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${axisY}" x2="${w-pad}" y2="${axisY}" stroke="var(--line)" stroke-width="1"></line>
    ${bars}
  </svg>`;
  const d = document.createElement('div');
  d.innerHTML = svg;
  return d.firstElementChild;
}

function buildRadarChart(bySection){
  const w=320,h=260,cx=w/2,cy=h/2-6,r=90;
  const axes = SECTION_ORDER;
  const n = axes.length;
  const pct = axes.map(s=>{
    const b = bySection[s];
    return b.total ? Math.max(0, b.correct / b.total) : 0;
  });
  function pt(i, frac){
    const ang = (Math.PI*2*i/n) - Math.PI/2;
    return [cx + Math.cos(ang)*r*frac, cy + Math.sin(ang)*r*frac];
  }
  let grid = '';
  [0.25,0.5,0.75,1].forEach(f=>{
    let pts=[];
    for(let i=0;i<n;i++){ pts.push(pt(i,f).join(',')); }
    grid += `<polygon points="${pts.join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"></polygon>`;
  });
  let spokes='', labels='';
  for(let i=0;i<n;i++){
    const [x,y] = pt(i,1);
    grid += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"></line>`;
    const [lx,ly] = pt(i,1.22);
    labels += `<text x="${lx}" y="${ly}" font-size="11" text-anchor="middle" fill="var(--ink-soft)">${axes[i].slice(0,4)}</text>`;
  }
  let dataPts=[];
  for(let i=0;i<n;i++){ dataPts.push(pt(i,pct[i]).join(',')); }
  const dataPoly = `<polygon points="${dataPts.join(' ')}" fill="#1c3f79" fill-opacity="0.28" stroke="#1c3f79" stroke-width="2"></polygon>`;
  let dots='';
  for(let i=0;i<n;i++){ const [x,y]=pt(i,pct[i]); dots += `<circle cx="${x}" cy="${y}" r="3.2" fill="#1c3f79"></circle>`; }
  const svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">${grid}${dataPoly}${dots}${labels}</svg>`;
  const d = document.createElement('div');
  d.innerHTML = svg;
  return d.firstElementChild;
}

async function renderAdmin(){
  const wrap = el('div','app-shell');
  const aw = el('div','admin-wrap');
  aw.innerHTML = `
    <div class="admin-topbar">
      <h2 class="serif" style="margin:0;color:var(--navy-900);">Admin &mdash; Student Database</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" id="btn-refresh">Refresh</button>
        <button class="btn btn-gold btn-sm" id="btn-export">Download CSV</button>
        <button class="btn btn-ghost btn-sm" id="btn-logout">Logout</button>
      </div>
    </div>
    <div id="admin-status" style="font-size:.8rem;color:var(--ink-soft);margin-bottom:10px;">Loading results&hellip;</div>
    <div class="admin-table-wrap"><table class="admin-table" id="admin-table"></table></div>
  `;
  wrap.appendChild(aw); root.appendChild(wrap);

  document.getElementById('btn-logout').addEventListener('click', ()=>{ S.screen='register'; render(); });

let ADMIN_ROWS = [];
async function loadAdminData(){
  const status = document.getElementById('admin-status');
  const table = document.getElementById('admin-table');
  if(!db){
    status.textContent = 'Database is not available in this view. Open the published artifact link in Claude to enable shared storage.';
    table.innerHTML = '';
    return;
  }
  try{
    const snap = await db.collection('results').orderBy('submittedAt','desc').get();
    ADMIN_ROWS = (snap && snap.docs) ? snap.docs.map(d=>d.data()) : [];
  }catch(e){
    status.textContent = 'Could not load results: ' + (e && e.message ? e.message : e);
    return;
  }
  status.textContent = ADMIN_ROWS.length + ' submission(s) on record.';
  let rows = '<tr><th>Date</th><th>Name</th><th>Mobile</th><th>Email</th><th>Marks</th><th>%</th><th>Correct</th><th>Wrong</th><th>Unatt.</th><th>Tab Sw.</th><th>Status</th></tr>';
  ADMIN_ROWS.forEach(r=>{
    const cheat = cheatStatusLabel(r.violations||{tabSwitches:0,copyAttempts:0,rightClicks:0,consoleAttempts:0,fullscreenExits:0});
    rows += `<tr><td>${new Date(r.submittedAt).toLocaleString()}</td><td>${r.name}</td><td>${r.mobile}</td><td>${r.email}</td><td>${r.marks}</td><td>${r.percentage}%</td><td>${r.correct}</td><td>${r.wrong}</td><td>${r.unattempted}</td><td>${r.violations?r.violations.tabSwitches:0}</td><td>${cheat.label}</td></tr>`;
  });
  table.innerHTML = rows;
}
async function exportCsv(){
  if(!ADMIN_ROWS.length){ return; }
  const headers = ['Date','Name','Mobile','Email','Marks','Percentage','Correct','Wrong','Unattempted','TabSwitches','CopyAttempts','RightClicks','ConsoleAttempts','FullscreenExits','ResultID'];
  const lines = [headers.join(',')];
  ADMIN_ROWS.forEach(r=>{
    const v = r.violations||{};
    lines.push([
      new Date(r.submittedAt).toISOString(), csvSafe(r.name), r.mobile, csvSafe(r.email),
      r.marks, r.percentage, r.correct, r.wrong, r.unattempted,
      v.tabSwitches||0, v.copyAttempts||0, v.rightClicks||0, v.consoleAttempts||0, v.fullscreenExits||0,
      r.resultId
    ].join(','));
  });
  const csv = lines.join('\n');
  if(downloadsCap){
    try{
      await downloadsCap.save({filename:'seamate_results.csv', data: csv});
      return;
    }catch(e){}
  }
  // fallback
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'seamate_results.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function csvSafe(s){
  s = String(s==null?'':s);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

/* ===================== boot ===================== */
render();
